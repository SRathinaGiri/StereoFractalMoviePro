name: Build Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_mingw
          tools: "tools_mingw1310"
          cache: true

      - name: FFmpeg (for the tests)
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Build
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "$env:RUNNER_WORKSPACE/Qt/Tools" -Directory -Filter "mingw*" | Select-Object -First 1
          $env:PATH = "$($mingw.FullName)\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Test
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "$env:RUNNER_WORKSPACE/Qt/Tools" -Directory -Filter "mingw*" | Select-Object -First 1
          $env:PATH = "$($mingw.FullName)\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          cd build
          ./TestStereo.exe

      - name: Package
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "$env:RUNNER_WORKSPACE/Qt/Tools" -Directory -Filter "mingw*" | Select-Object -First 1
          $env:PATH = "$($mingw.FullName)\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/StereoMoviePro.exe dist/
          windeployqt --compiler-runtime --release dist/StereoMoviePro.exe
          Copy-Item README.md, LICENSE dist/

      - uses: actions/upload-artifact@v4
        with:
          name: StereoFractalMoviePro-windows-x64
          path: dist/

      # On main: if the version in CMakeLists.txt has no tag yet, build the
      # installer/portable/source packages and publish a GitHub release for it.
      - name: Check for a new version
        id: ver
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $exists = git ls-remote --tags origin "refs/tags/v$ver"
          "version=$ver" >> $env:GITHUB_OUTPUT
          if ($exists) { "release=false" >> $env:GITHUB_OUTPUT } else { "release=true" >> $env:GITHUB_OUTPUT }
          Write-Host "Version $ver, already tagged: $([bool]$exists)"

      - name: Release packages
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force release_assets | Out-Null
          Compress-Archive -Path dist/* -DestinationPath "release_assets/StereoFractalMoviePro-Portable-v$ver.zip"
          git archive --format=zip -o "release_assets/StereoFractalMoviePro-Source-v$ver.zip" HEAD
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer/StereoFractalMoviePro.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release_assets

      - name: Publish GitHub release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stereo Fractal Movie Pro v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: release_assets/*
